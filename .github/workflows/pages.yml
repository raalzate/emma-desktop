# Publica la vitrina (site/) en GitHub Pages.
#
# El "why": la página se sirve desde la rama `gh-pages` (Pages → Deploy from a
# branch), así que main nunca guarda el sitio publicado. Este workflow copia
# `site/` a esa rama cada vez que cambia en main: no hay build, el sitio es HTML
# y CSS planos. El historial de gh-pages se conserva (un commit por publicación),
# así que el push es normal y nunca reescribe nada.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar site/ a la rama gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add ../publicacion -B gh-pages origin/gh-pages
          else
            git worktree add --detach ../publicacion
            git -C ../publicacion checkout --orphan gh-pages
          fi
          cd ../publicacion
          git rm -rqf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/site/." .
          # .nojekyll: sin él, GitHub Pages pasa el sitio por Jekyll y descarta
          # las rutas que empiezan con guion bajo.
          touch .nojekyll
          # Todo el directorio, no una lista de nombres: enumerarlos dejó fuera
          # `ultima-version.js` el día que se agregó, y la página se publicó sin
          # él sin que nada fallara. Acá el directorio es lo que se acaba de
          # copiar de `site/`, nada más.
          git add --all -- .
          git commit -m "chore(pages): publica site/ desde ${GITHUB_SHA::7}" || true

          # El freno: lo publicado tiene que ser EXACTAMENTE el contenido de
          # site/. Sin esta comparación, publicar de menos termina en verde y el
          # 404 lo descubre un visitante (pasó con `ultima-version.js`).
          origen=$(cd "$GITHUB_WORKSPACE/site" && find . -type f | sort)
          publicado=$(git ls-files | grep -v '^\.nojekyll$' | sed 's|^|./|' | sort)
          if [ "$origen" != "$publicado" ]; then
            echo "PAGES ROJO — lo publicado no coincide con site/:"
            diff <(echo "$origen") <(echo "$publicado") || true
            exit 1
          fi

          git push origin gh-pages
