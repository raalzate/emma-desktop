<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Icono de EMMA — paleta «Café sereno» (docs/design/rediseno-cafe-sereno.md).
    La marca de la app es el wordmark `emma.`: una «e» y un punto ámbar que es la
    voz de Emma. El icono es ese gesto, no una burbuja de chat genérica.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5478B4"/>
      <stop offset="0.5" stop-color="#3E639E"/>
      <stop offset="1" stop-color="#2A4571"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.26" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ambar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCA55E"/>
      <stop offset="1" stop-color="#C08238"/>
    </linearGradient>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1B2C49" flood-opacity="0.32"/>
    </filter>
    <!-- La «e»: anillo + barra, con la apertura recortada abajo a la derecha. -->
    <mask id="apertura">
      <rect x="0" y="0" width="1024" height="1024" fill="#000"/>
      <g fill="#fff">
        <circle cx="455" cy="530" r="250"/>
      </g>
      <g fill="#000">
        <circle cx="455" cy="530" r="158"/>
        <path d="M455 530 L1055 636 L935 990 Z"/>
      </g>
      <rect x="210" y="484" width="490" height="92" fill="#fff"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#fondo)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#luz)"/>

  <g filter="url(#sombra)" transform="translate(-22 0)">
    <g transform="translate(512 512) scale(0.84) translate(-512 -512)">
      <rect x="0" y="0" width="1024" height="1024" fill="#F6F5F1" mask="url(#apertura)"/>
    </g>
    <circle cx="752" cy="680" r="62" fill="url(#ambar)"/>
  </g>
</svg>
